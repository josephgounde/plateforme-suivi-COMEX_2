totem {
    version: 2
    cluster_name: pdoe_cluster
    transport: knet
    crypto_cipher: aes256
    crypto_hash: sha256
}

nodelist {
    node {
        ring0_addr: pdoe-a
        name: pdoe-a
        nodeid: 1
    }
    node {
        ring0_addr: pdoe-b
        name: pdoe-b
        nodeid: 2
    }
    node {
        ring0_addr: pdoe-witness
        name: pdoe-witness
        nodeid: 3
    }
    node {
        ring0_addr: pdoe-c
        name: pdoe-c
        nodeid: 4
    }
}

quorum {
    provider: corosync_votequorum
}

logging {
    to_logfile: yes
    logfile: /var/log/corosync/corosync.log
    to_syslog: yes
}
