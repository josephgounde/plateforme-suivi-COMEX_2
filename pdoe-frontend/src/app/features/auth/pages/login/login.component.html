<div class="login-page">
  <div class="login-card">

    <header class="login-header">
      <img class="login-logo" src="logo-afriland-first-bank.png" alt="Afriland First Bank" />
      <h1>GSA-COMEX</h1>
      <p class="login-subtitle">
        Plateforme de Gestion et Suivi des Apurements COMEX
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="soumettre()" class="login-form" novalidate>
      <div class="form-field">
        <label for="login">Identifiant AD</label>
        <input
          id="login"
          type="text"
          formControlName="login"
          autocomplete="username"
          placeholder="prenom.nom"
        />
        <span
          class="field-error"
          *ngIf="form.get('login')?.invalid && form.get('login')?.touched"
        >
          L'identifiant est requis.
        </span>
      </div>

      <div class="form-field">
        <label for="password">Mot de passe</label>
        <div class="password-field">
          <input
            id="password"
            [type]="motDePasseVisible ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="btn-toggle-password"
            [attr.aria-label]="motDePasseVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            (click)="togglerVisibiliteMotDePasse()"
          >
            <svg *ngIf="!motDePasseVisible" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="motDePasseVisible" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <span
          class="field-error"
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
        >
          Le mot de passe est requis.
        </span>
      </div>

      <p class="login-error" *ngIf="erreur" role="alert">{{ erreur }}</p>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Connexion en cours…' : 'Se connecter' }}
      </button>
    </form>

    <section class="quick-login" aria-label="Connexion rapide pour le développement" *ngIf="modeMock">
      <p class="quick-login-label">Connexion rapide (environnement de test)</p>
      <div class="quick-login-grid">
        <button
          type="button"
          *ngFor="let option of connexionsRapides"
          class="quick-login-btn"
          (click)="connexionRapide(option.login)"
        >
          {{ option.libelle }}
        </button>
      </div>
    </section>

  </div>
</div>
