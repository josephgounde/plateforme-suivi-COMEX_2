<nav class="pager" *ngIf="totalPages > 1" aria-label="Pagination">
  <span class="pager-info">{{ debutIndex }}–{{ finIndex }} sur {{ total }}</span>

  <div class="pager-controls">
    <button
      type="button"
      class="pager-btn pager-btn--nav"
      [disabled]="page === 1"
      (click)="allerA(page - 1)"
      aria-label="Page précédente"
    >
      ‹
    </button>

    <ng-container *ngFor="let p of pagesAffichees">
      <span *ngIf="p === '…'" class="pager-ellipsis">…</span>
      <button
        *ngIf="p !== '…'"
        type="button"
        class="pager-btn"
        [class.pager-btn--active]="p === page"
        [attr.aria-current]="p === page ? 'page' : null"
        (click)="allerA(p)"
      >
        {{ p }}
      </button>
    </ng-container>

    <button
      type="button"
      class="pager-btn pager-btn--nav"
      [disabled]="page === totalPages"
      (click)="allerA(page + 1)"
      aria-label="Page suivante"
    >
      ›
    </button>
  </div>
</nav>
