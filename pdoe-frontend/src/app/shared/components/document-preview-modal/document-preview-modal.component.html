<div class="modal-backdrop" (click)="fermer.emit()"></div>

<div class="preview-modal" role="dialog" aria-modal="true">
  <button type="button" class="modal-close" (click)="fermer.emit()" aria-label="Fermer">✕</button>

  <header class="preview-header">
    <h3>{{ document.nomFichier }}</h3>
    <p class="preview-meta">{{ typeDocumentLabels[document.typeDocument] }} · {{ formaterTaille(document.tailleFichier) }}</p>
  </header>

  <div class="preview-body">
    <img *ngIf="nature === 'image'" [src]="objectUrl" [alt]="document.nomFichier" class="preview-image" />

    <iframe *ngIf="nature === 'pdf'" [src]="objectUrlSafe" class="preview-pdf" title="Aperçu PDF"></iframe>

    <div class="preview-fallback" *ngIf="nature === 'inconnu'">
      <span class="preview-fallback-icon">📄</span>
      <p *ngIf="fichier">Aperçu non disponible pour ce type de fichier.</p>
      <p *ngIf="!fichier">Aperçu indisponible pour ce document (chargé sans fichier réel dans cette démonstration).</p>
    </div>
  </div>

  <footer class="preview-footer" *ngIf="fichier">
    <button type="button" class="btn-telecharger" (click)="telecharger()">Télécharger</button>
  </footer>
</div>
