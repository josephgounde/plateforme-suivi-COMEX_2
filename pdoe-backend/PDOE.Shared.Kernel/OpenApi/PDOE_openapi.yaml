        conformiteBCEAO:
          type: boolean
          description: Obligatoire à l'étape 3
        lcbftConforme:
          type: boolean
          description: Obligatoire à l'étape 3

    RejeterEtapeRequest:
      type: object
      required: [niveauValidation, motifRejet, responsableCorrection]
      properties:
        niveauValidation:
          $ref: '#/components/schemas/NiveauValidation'
        motifRejet:
          type: string
          maxLength: 1000
        responsableCorrection:
          type: string
          description: |
            Code de l'étape (WorkflowEtapes.Code — historique ou
            personnalisée) vers laquelle renvoyer le dossier pour
            correction — doit être une étape ACTIVE déjà franchie (index ≤
            étape courante dans l'ordre configuré), jamais en avance.
            String plutôt que NiveauValidation : une étape personnalisée
            ajoutée par l'Admin DSIRI n'appartient pas aux 7 valeurs
            historiques. Le dossier repasse dans la file d'attente de
            cette étape ; seul le titulaire du portefeuille (Gestionnaire)
            ou le profil de cette étape est notifié.

