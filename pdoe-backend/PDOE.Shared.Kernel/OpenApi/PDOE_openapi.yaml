    # ── Workflow-config — étapes du circuit configurables ────
    TypeEtapeWorkflow:
      type: string
      enum: [GESTIONNAIRE, COMEX, TRESORERIE, EXECUTION, APUREMENT, GENERIQUE]
      description: |
        Détermine l'écran cible : les 5 premières valeurs routent vers
        leur tableau de bord spécialisé existant ; GENERIQUE route vers
        l'écran de secours générique (sousEtat EN_ATTENTE/VALIDE/REJETE),
        utilisé par toute étape ajoutée sans dashboard dédié.

    SousEtat:
      type: string
      enum: [EN_ATTENTE, VALIDE, REJETE]
      description: Sous-état d'un dossier positionné sur une étape GENERIQUE — remplace StatutDossier pour ces étapes-là uniquement.

