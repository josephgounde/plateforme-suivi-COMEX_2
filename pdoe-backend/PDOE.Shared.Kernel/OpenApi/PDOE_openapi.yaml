          minLength: 1
          maxLength: 10
          description: Initiales de l'agent ayant effectué la vérification visuelle

    # ── Réponses ────────────────────────────────────────────
    DossierResponse:
      type: object
      properties:
        dossierId:
          type: integer
        referenceInterne:
          type: string
          description: N° interne attribué à la création — distinct de referenceSWIFT, la vraie référence COMEX du processus physique, attribuée à la déclaration d'exécution.
          example: COMEX-202506-0042
        numCompte:
          type: string
        nomClient:
          type: string
        typeOperation:
          $ref: '#/components/schemas/TypeOperation'
        montant:
          type: number
        devise:
          type: string
        paysBeneficiaire:
          type: string
        motif:
          type: string
        matriculeClient:
          type: string
        nomBeneficiaire:
          type: string
        natureTransaction:
          type: string
        referenceDomiciliation:
          type: string
          nullable: true
        codeStatistiqueOperateur:
          type: string
          nullable: true
        nifClient:
          type: string
          nullable: true
        adressePostaleClient:
          type: string
          nullable: true
        adresseGeographiqueClient:
          type: string
          nullable: true
        codeBanque:
          type: string
          nullable: true
          description: Code banque (Afriland First Bank CI).
        qualiteResidence:
          allOf:
            - $ref: '#/components/schemas/QualiteResidence'
          nullable: true
        dateOuvertureCompte:
          type: string
          format: date
          nullable: true
        anneeExerciceCompte:
          type: integer
          nullable: true
        typeCompteDebite:
          $ref: '#/components/schemas/TypeCompte'
        codeSwiftIndicatif:
          type: string
          nullable: true
        banqueCorrespondanteIndicative:
          type: string
          nullable: true
        statutElectronique:
          $ref: '#/components/schemas/StatutDossier'
        etapeGenerique:
          allOf:
            - $ref: '#/components/schemas/EtapeGeneriqueInfo'
          nullable: true
        gestionnaireAssigne:
          type: string
          description: |
            LoginAD du Gestionnaire responsable de ce dossier — hérité du
            portefeuille client à la création, réattribuable par l'Admin
            DSIRI tant que le dossier n'a pas dépassé l'étape Gestionnaire
            (voir PATCH /dossiers/{dossierId}/gestionnaire).
        modeVerificationApplique:
          $ref: '#/components/schemas/ModeVerificationSignature'
        signatureVerifieeVisuellement:
          type: boolean
        initialesAgent:
          type: string
          nullable: true

        # Validation gestionnaire (étape 2)
        dateConfirmationClient:
          type: string
          format: date-time
          nullable: true
        soldeCompteVerifie:
          type: boolean
        soldeSuffisant:
          type: boolean
          nullable: true
          description: Résultat de la dernière vérification, calculé par PDOE (jamais fourni tel quel par ABS2000) — null tant qu'aucune vérification n'a eu lieu.
        soldeConstate:
          type: number
          format: decimal
          nullable: true
          description: Solde brut constaté chez ABS2000 lors de la dernière vérification, dans deviseConstatee (pas forcément la devise du dossier).
        deviseConstatee:
          type: string
          nullable: true
        dateVerificationSolde:
          type: string
          format: date-time
          nullable: true

        # Coordonnées client — pour notifier-client (SMS/Email), pas
        # renseignées à la création (v1 : pas encore de lookup CBS pour
        # ces champs) — nullable tant qu'aucune source ne les alimente.
        emailClient:
          type: string
          nullable: true
        telephoneClient:
          type: string
          nullable: true

        # Paramètres Trésorerie (étape 4)
        tauxChange:
          type: number
          nullable: true
        deviseCotation:
          type: string
          nullable: true
        correspondantDesigne:
          type: string
          nullable: true
        bicCorrespondant:
          type: string
          nullable: true
        dateDebit:
          type: string
          format: date
          nullable: true
        couverture:
          type: string
          nullable: true
        disponibiliteFonds:
          type: boolean

        # Exécution SWIFT (étape 5)
        referenceABS:
          type: string
          nullable: true
        referenceSWIFT:
          type: string
          nullable: true
        numeroAC:
          type: string
          nullable: true
        codeTRF:
          type: string
          nullable: true
        dateExecution:
          type: string
          format: date-time
          nullable: true
        montantExecute:
          type: number
          nullable: true

        # Apurement (étape 6)
        dateEcheanceApurement:
          type: string
          format: date
          nullable: true
        soldeRestantApurement:
          type: number
          nullable: true
        apurementComplet:
          type: boolean

        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

        dateDerniereAction:
          type: string
          format: date-time
          description: |
            Date de la dernière transition workflow enregistrée pour ce
            dossier (EtapesWorkflow.DateAction le plus récent — cf.
            VW_DossiersCours.DateDerniereAction). Point de départ du
            calcul de délai de traitement de l'étape courante (cf.
            ParametrageMetier.DELAI_*_HEURES) ; retombe sur updatedAt
            tant qu'aucune transition n'a encore eu lieu (BROUILLON).

