          type: integer
        libelle:
          type: string
          example: Justificatif douanier (D3/BAE) reçu et vérifié
        ordre:
          type: integer
          minimum: 1
        actif:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    ChecklistItemConfigCreateRequest:
