        codeTRF:
          type: string
          maxLength: 30
          description: "Code TRF (formulaire de change) — facultatif, saisi par l'Agent COMEX à la déclaration d'exécution."
        dateExecution:
          type: string
          format: date-time
        montantExecute:
          type: number
          format: decimal
          minimum: 0.0001

