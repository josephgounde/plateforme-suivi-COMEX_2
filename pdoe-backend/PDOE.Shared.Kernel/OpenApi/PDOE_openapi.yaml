          format: date-time
        updatedBy:
          type: string

    EtapeWorkflowConfigCreateRequest:
      type: object
      required: [code, libelle, ordre]
      description: |
        typeEtape est optionnel et vaut GENERIQUE par défaut — créer une
        étape avec un typeEtape spécialisé (ex COMEX) sans qu'un
        dashboard existant ne soit prévu pour la router n'a de sens que
        pour les 7 étapes historiques (déjà en base via le seed) ; toute
        étape ajoutée après coup par un Admin doit rester GENERIQUE.
      properties:
        code:
          type: string
          maxLength: 30
          pattern: '^[A-Z0-9_]+$'
          example: ETAPE_8_CONFORMITE
        libelle:
          type: string
          maxLength: 100
        ordre:
          type: integer
          minimum: 1
          description: |
            Position d'insertion — les étapes existantes à cette
            position et au-delà sont décalées de +1.
        typeEtape:
          allOf:
            - $ref: '#/components/schemas/TypeEtapeWorkflow'
          nullable: true
        description:
          type: string
          maxLength: 500

    EtapeWorkflowConfigUpdateRequest:
      type: object
      description: |
        Toutes les propriétés sont optionnelles — seuls les champs
        fournis sont modifiés. ordre n'est PAS modifiable ici (voir
        PATCH /workflow-config/etapes/reordonner).
      properties:
        libelle:
          type: string
          maxLength: 100
        actif:
          type: boolean
          nullable: true
          description: |
            Désactiver une étape (actif=false) n'affecte que les
            NOUVELLES entrées dans le circuit ; un dossier déjà
            positionné sur cette étape au moment de la désactivation
            continue son traitement normalement jusqu'à sa sortie.
        description:
          type: string
          maxLength: 500

    ReordonnerEtapesRequest:
      type: object
      required: [ordre]
      properties:
        ordre:
          type: array
          description: |
            Liste COMPLÈTE des codes d'étape (actives et inactives),
            dans le nouvel ordre souhaité — la position dans le tableau
            (1-based) devient la nouvelle valeur ordre. Doit contenir
            exactement les mêmes codes que GET /workflow-config/etapes,
            sans doublon ni omission (422 sinon).
          items:
            type: string
          example: [ETAPE_1_INITIATION, ETAPE_2_GESTIONNAIRE, ETAPE_4_TRESORERIE, ETAPE_3_COMEX, ETAPE_5_EXECUTION, ETAPE_6_APUREMENT, ETAPE_7_ARCHIVAGE]

    # ── ChecklistConfig — items de la checklist d'apurement ──
    ReordonnerChecklistItemsRequest:
      type: object
      required: [ordre]
      properties:
        ordre:
          type: array
          description: |
            Liste COMPLÈTE des checklistItemId, dans le nouvel ordre
            souhaité — doit contenir exactement les mêmes ids que
            GET /checklist-config/items, sans doublon ni omission
            (422 sinon).
          items:
            type: integer
          example: [3, 1, 2]

    ChecklistItemConfig:
