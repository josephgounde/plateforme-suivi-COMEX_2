          nullable: true
        nomBeneficiaire:
          type: string
          nullable: true
        natureTransaction:
          type: string
          nullable: true
        referenceDomiciliation:
          type: string
          nullable: true
        codeStatistiqueOperateur:
          type: string
          nullable: true
        nifClient:
          type: string
          nullable: true
        adressePostaleClient:
          type: string
          nullable: true
        adresseGeographiqueClient:
          type: string
          nullable: true
        telephoneClient:
          type: string
          nullable: true
        codeBanque:
          type: string
          nullable: true
        qualiteResidence:
