          $ref: '#/components/schemas/TypeDocument'
        referenceDocument:
          type: string
          maxLength: 100
          nullable: true
          description: "N° de référence du document lui-même (ex : n° de facture, n° d'AC, n° de formulaire de change) — distinct du nom système du fichier uploadé. Pertinent surtout pour FACTURE_PROFORMA/FACTURE_DEFINITIVE/AUTORISATION_CHANGE/FORMULAIRE_CHANGE."
        estObligatoire:
          type: boolean
          default: false
        paiementId:
          type: integer
          nullable: true

    ValidationVisuelleRequest:
      type: object
      required: [initialesAgent]
